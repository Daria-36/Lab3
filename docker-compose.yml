services:
  postgres:
    image: postgres:16
    container_name: mission-archive-postgres
    environment:
      POSTGRES_DB: mission_archive
      POSTGRES_USER: mission_user
      POSTGRES_PASSWORD: mission_password
    ports:
      - "5432:5432"
    volumes:
      - mission_archive_pg:/var/lib/postgresql/data
volumes:
  mission_archive_pg:
